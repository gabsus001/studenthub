<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaloguj się - StudentHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">🎓 StudentHub</h4>
                    </div>
                    <div class="card-body p-4">
                        <h5 class="text-center mb-4 text-muted">Zaloguj się do panelu</h5>

                        <form method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label text-secondary">Nazwa użytkownika</label>
                                <input type="text" name="username" class="form-control" placeholder="Wpisz swój login" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label text-secondary">Hasło</label>
                                <input type="password" name="password" class="form-control" placeholder="Wpisz hasło" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Zaloguj się</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
